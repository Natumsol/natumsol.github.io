  const form = document.querySelector('.search-form');
  const input = document.querySelector('#search-query');
  const status = document.querySelector('.search-status');
  const results = document.querySelector('.search-results');
  let index;

  function render(entries, query) {
    if (!results || !status) return;
    results.replaceChildren();
    if (!query) {
      status.textContent = '输入关键词以搜索公开文章。';
      return;
    }
    status.textContent = `找到 ${entries.length} 篇与「${query}」相关的文章。`;
    for (const entry of entries) {
      const item = document.createElement('li');
      const link = document.createElement('a');
      const summary = document.createElement('p');
      link.href = entry.url;
      link.textContent = entry.title;
      summary.textContent = entry.description;
      item.append(link, summary);
      results.append(item);
    }
  }

  async function search(query) {
    const normalized = query.trim().toLocaleLowerCase('zh-CN');
    if (!normalized) {
      render([], '');
      return;
    }
    if (!index) {
      const response = await fetch('/search-index.json');
      if (!response.ok) throw new Error('Unable to load search index');
      index = await response.json();
    }
    const terms = normalized.split(/\s+/);
    const matches = index.filter((entry) => {
      const searchable = `${entry.title} ${entry.description} ${entry.content}`.toLocaleLowerCase('zh-CN');
      return terms.every((term) => searchable.includes(term));
    });
    render(matches, query.trim());
  }

  const initialQuery = new URLSearchParams(window.location.search).get('q') ?? '';
  if (input) input.value = initialQuery;
  search(initialQuery).catch(() => {
    if (status) status.textContent = '搜索暂时不可用，请稍后再试。';
  });

  form?.addEventListener('submit', (event) => {
    event.preventDefault();
    const query = input?.value ?? '';
    const url = new URL(window.location.href);
    query.trim() ? url.searchParams.set('q', query.trim()) : url.searchParams.delete('q');
    window.history.replaceState({}, '', url);
    search(query).catch(() => {
      if (status) status.textContent = '搜索暂时不可用，请稍后再试。';
    });
  });
</script>
