  // Client-side navigation reruns this script; keep each page's bindings local.
  (() => {
    const form = document.querySelector('.search-form');
    const input = document.querySelector('#search-query');
    const status = document.querySelector('.search-status');
    const results = document.querySelector('.search-results');
    if (!form || !input || !status || !results) return;

    let indexPromise;
    let searchVersion = 0;

    function loadIndex() {
      if (!indexPromise) {
        indexPromise = fetch('/search-index.json')
          .then((response) => {
            if (!response.ok) throw new Error('Unable to load search index');
            return response.json();
          })
          .catch((error) => {
            indexPromise = undefined;
            throw error;
          });
      }
      return indexPromise;
    }

    function render(entries, query) {
      results.replaceChildren();
      status.textContent = `找到 ${entries.length} 篇与「${query}」相关的文章。`;
      for (const entry of entries) {
        const item = document.createElement('li');
        const link = document.createElement('a');
        const summary = document.createElement('p');
        link.href = entry.url;
        link.textContent = entry.title;
        summary.textContent = entry.description;
        item.append(link, summary);
        results.append(item);
      }
    }

    async function search(query) {
      const version = ++searchVersion;
      const trimmed = query.trim();
      results.replaceChildren();
      if (!trimmed) {
        status.textContent = '输入关键词以搜索公开文章。';
        return;
      }
      status.textContent = '正在搜索…';
      try {
        const index = await loadIndex();
        if (version !== searchVersion || !form.isConnected) return;
        const terms = trimmed.toLocaleLowerCase('zh-CN').split(/\s+/);
        const matches = index.filter((entry) => {
          const searchable = `${entry.title} ${entry.description} ${entry.content}`.toLocaleLowerCase('zh-CN');
          return terms.every((term) => searchable.includes(term));
        });
        render(matches, trimmed);
      } catch {
        if (version === searchVersion && form.isConnected) {
          status.textContent = '搜索暂时不可用，请稍后再试。';
        }
      }
    }

    function updateQuery(query) {
      const url = new URL(window.location.href);
      query ? url.searchParams.set('q', query) : url.searchParams.delete('q');
      // Preserve the router's history metadata for article/back navigation.
      window.history.replaceState(window.history.state, '', url);
    }

    input.value = new URLSearchParams(window.location.search).get('q') ?? '';
    search(input.value);

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const query = input.value.trim();
      updateQuery(query);
      search(query);
    });

    input.addEventListener('input', () => {
      if (!input.value) {
        updateQuery('');
        search('');
      }
    });
  })();
</script>
